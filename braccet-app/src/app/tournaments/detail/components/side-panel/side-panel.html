<div class="bg-white rounded-lg shadow border border-gray-200 flex h-[calc(100vh-15rem)]">
  <!-- Vertical tab sidebar -->
  <div class="w-48 border-r border-gray-200 bg-gray-50 rounded-l-lg flex-shrink-0">
    <nav class="flex flex-col p-2 space-y-1">
      @for (tab of tabs(); track tab.id) {
        <button
          (click)="setActiveTab(tab.id)"
          [class]="'px-3 py-2 text-sm font-medium rounded-lg transition-colors ' +
            (isActiveTab(tab.id)
              ? 'bg-blue-100 text-blue-400 border-l-4 border-blue-400'
              : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900')"
        >
          {{ tab.label }}
        </button>
      }
    </nav>
  </div>

  <!-- Tab content area -->
  <div class="flex-1 p-2 overflow-hidden">
    @switch (activeTab()) {
      @case ('bracket') {
        <app-bracket-tab
          (tournamentEnded)="onTournamentUpdated($event)"
          (tournamentReset)="onTournamentUpdated($event)"
        />
      }
      @case ('participants') {
        <app-participants-tab
          [currentUserParticipant]="currentUserParticipant()"
          [canSelfRegister]="canSelfRegister()"
          [communitySlug]="communitySlug()"
          (participantAdded)="onParticipantAdded($event)"
          (participantRemoved)="onParticipantRemoved($event)"
          (participantWithdrawn)="onParticipantWithdrawn($event)"
          (seedingChanged)="onSeedingChanged($event)"
          (selfRegistered)="onSelfRegistered($event)"
          (left)="onLeft($event)"
          (participantUpdated)="onParticipantUpdated($event)"
        />
      }
      @case ('standings') {
        <app-standings-tab />
      }
      @case ('settings') {
        <app-settings-tab
          (tournamentUpdated)="onTournamentUpdated($event)"
          (stageUpdated)="onStageUpdated($event)"
        />
      }
    }
  </div>
</div>
